[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaze-infer"
version = "0.1.0"
description = "Triton で書いた LLM 推論エンジン"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "triton>=3.0",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
kaze = "kaze.__main__:main"

[tool.setuptools]
packages = ["kaze", "kaze.kernels"]
